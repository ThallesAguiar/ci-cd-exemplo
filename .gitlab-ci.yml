# Este arquivo é a lista de tarefas que o robô do GitLab deve fazer.
# Pense nele como uma receita: o robô lê de cima para baixo e segue os passos.

# "stages" é a ordem das grandes fases da receita.
stages:
  # Primeiro, conferimos se o código funciona.
  - test
  # Depois, colocamos a aplicação dentro de uma caixa Docker.
  - build
  # Por último, pedimos para o Kubernetes usar a caixa nova.
  - deploy

# Este é o nome da primeira tarefa. Ele pode ser um nome fácil de entender.
realizar_testes:
  # Esta tarefa fica na fase chamada "test".
  stage: test
  # O GitLab cria um computador temporário com Node.js 20 para esta tarefa.
  image: node:20.7.0-alpine3.17
  # "before_script" são passos de arrumação antes do trabalho principal.
  before_script:
    # O código Node.js mora dentro da pasta app, então entramos nessa pasta.
    - cd app/
    # Baixamos as bibliotecas que o programa usa, como se fossem peças de Lego.
    - npm install
  # "script" são os passos que fazem o trabalho desta tarefa.
  script:
    # Roda os testes escritos pelo projeto. Se um falhar, o pipeline para aqui.
    - npm test

# Esta tarefa fabrica a imagem Docker, que é a caixa da aplicação pronta para viajar.
criar_imagem_docker:
  # Ela só começa depois que a fase de testes terminou bem.
  stage: build
  # Esta imagem temporária já vem com o comando Docker instalado.
  image: docker:24.0.7-cli
  # "services" são ajudantes que ficam ao lado do computador principal.
  services:
    # Docker-in-Docker é o ajudante que sabe montar caixas Docker.
    - docker:24.0.7-dind
  # "variables" são pequenos bilhetes com configurações para esta tarefa.
  variables:
    # Para este exemplo de aula, desligamos uma camada extra de segurança do Docker.
    DOCKER_TLS_CERTDIR: ""
    # Este é o endereço do ajudante Docker que foi criado em services.
    DOCKER_HOST: tcp://docker:2375
  # Antes de criar a caixa, precisamos abrir o armário onde ela será guardada.
  before_script:
    # Faz login no Container Registry do GitLab com uma senha temporária do próprio GitLab.
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Monta a caixa usando o Dockerfile e dá a ela o número curto deste commit.
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Coloca a caixa pronta no armário online do GitLab.
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  # "rules" decide quando a tarefa pode acontecer.
  rules:
    # Só criamos e publicamos caixas para a branch principal, chamada main.
    - if: '$CI_COMMIT_BRANCH == "main"'

# Esta tarefa avisa o Kubernetes que existe uma versão nova da aplicação.
enviar_para_kubernetes:
  # Ela fica na última fase, depois de a imagem Docker já estar guardada.
  stage: deploy
  # Esta imagem temporária já traz o kubectl, o controle remoto do Kubernetes.
  image: bitnami/kubectl:1.29
  # Antes de falar com o Kubernetes, criamos um arquivo de acesso temporário.
  before_script:
    # KUBE_CONFIG_DATA é um segredo: ele guarda a chave do cluster em formato Base64.
    # O comando transforma o segredo em um arquivo chamado kubeconfig, só neste robô.
    - echo "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig
  script:
    # Entrega ao Kubernetes as instruções da pasta kubernetes.
    - kubectl --kubeconfig=kubeconfig apply -f kubernetes/
    # Troca a imagem antiga pela imagem criada neste commit.
    - kubectl --kubeconfig=kubeconfig -n curso-cicd set image deployment/aplicacao-node aplicacao-node="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    # Só fazemos deploy na main e se a chave secreta do cluster foi cadastrada.
    - if: '$CI_COMMIT_BRANCH == "main" && $KUBE_CONFIG_DATA'
